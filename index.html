<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" /> <!-- Set character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Make page responsive -->
    <title>Sportify - Web Player: Music for everyone</title> <!-- Browser tab title -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml"> <!-- Page icon -->
    <link rel="stylesheet" href="style.css" /> <!-- Main stylesheet -->
    <link rel="stylesheet" href="utility.css" /> <!-- Utility styles for layout -->
</head>

<body>
    <div class="container flex bgblack"> <!-- Main container with flex layout and dark background -->

        <!-- LEFT SIDEBAR -->
        <div class="left">

            <!-- Home section -->
            <div class="close invert">
                <img width="30px" src="svg/close.svg" alt="sportify-logo">
            </div>
            <div class="home bggrey rounded m1 p1">

                <div><img src="svg/logo.svg" alt="Sportify logo" class="invert"></div> <!-- Logo -->

                <ul>
                    <li><img src="svg/home.svg" class="invert" alt="home">Home</li>
                    <li><img src="svg/search.svg" class="invert" alt="search">Search</li>
                </ul>
            </div>

            <!-- Your Library section -->
            <div class="library bggrey rounded m1 p1">
                <div class="heading">
                    <img src="svg/playlist.svg" alt="playlist" class="invert">
                    <h2>Your Library</h2>
                </div>
                <div class="songlist">
                    <ul id="songList"></ul> <!-- JavaScript dynamically injects song list here -->
                </div>

                <!-- Footer Links -->
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/">Legal</a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/">Privacy Center</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/">Privacy Policy</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/">Cookies</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">About Ads</a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/">Accessibility</a></div>
                </div>
            </div>
        </div>

        <!-- RIGHT MAIN CONTENT -->
        <div class="right border bggrey rounded">

            <!-- Header navigation bar -->
            <div class="header">
                <div class="nav">

                    <div class="hamburgercontiner">
                        <img class="invert hamburger" src="svg/hamburger.svg" alt="hamburger">

                        <!-- Arrow Icons (SVGs) -->
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M15 6L9.7 11.3C9.4 11.6 9.2 11.8 9.2 12C9.2 12.2 9.4 12.4 9.7 12.7L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M9 18L14.3 12.7C14.6 12.4 14.8 12.2 14.8 12C14.8 11.8 14.6 11.6 14.3 11.3L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                    </div>

                </div>

                <!-- Auth Buttons -->
                <div class="buttons">
                    <button class="signupbtn">Sign Up</button>
                    <button class="loginbtn">Log in</button>
                </div>
            </div>

            <!-- Main playlist cards section -->
            <div class="sportifyPlaylists">
                <h1>Spotify Playlists</h1>



                <div class="cardContainer">
                    <div id="albumContainer"></div>





                    <!-- Music Playbar at the bottom -->
                    <div class="playbar">
                        <div class="nowplayinginfo ">
                            <p><span id="nowPlaying"></span></p> <!--Current playing song -->
                        </div>

                        <!-- Control buttons: previous, play/pause, next -->
                        <div class="playpause invert">
                            <!-- <button id="prevBtn"><img src="svg/prevsong.svg" alt="Previous"></button>
                            <button id="playPause"><img src="svg/play.svg" alt="Play"></button>
                            <button id="nextBtn"><img src="svg/nextsong.svg" alt="Next"></button> -->
                            <img src="svg/prevsong.svg" alt="Previous" id="prevBtn" />
                            <img src="svg/play.svg" alt="Play" id="playPause" />
                            <img src="svg/nextsong.svg" alt="Next" id="nextBtn" />

                        </div>


                        <div class="time">
                            <span id="timeDisplay">00:00 / 00:00</span> <!-- Time display -->
                            <input id="seekbar" type="range" value="0" max="100" step="1">
                        </div>

                        <!-- Volume icon and slider -->
                        <div class="volume-control ">
                            <img src="svg/volume.svg" alt="Volume Icon" id="volumeBtn" class="invert" />
                            <div class="range">
                                <input type="range" id="volumeSlider" min="0" max="100" value="50" step="1" class="invert">
                            </div>
                            <!-- <audio id="myAudio" src="your-audio.mp3" controls></audio> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
